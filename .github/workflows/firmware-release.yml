name: Prepare ARCANA firmware release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.15.0
        required: true
jobs:
  firmware:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio==6.2.0
      - name: Build firmware
        run: platformio run -d firmware
      - name: Verify version and package firmware
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python tools/package_firmware.py --tag "$RELEASE_TAG"
      - name: Upload reviewable build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arcana-firmware
          path: build/release-assets/*
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; preserving its uploaded firmware assets."
            exit 0
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "ARCANA $RELEASE_TAG" --notes "Guition JC3636K718 firmware. Wireless installation requires the one-time OTA-enabled USB setup. Review and test before publishing."
          gh release upload "$RELEASE_TAG" build/release-assets/*
